<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen Display System (KDS) - Nepali Momo</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f0518',
                            card: '#1e112e',
                            header: '#150822',
                        },
                        brand: {
                            purple: '#7627a3',
                            gold: '#fbbf24',
                            green: '#22c55e',
                            red: '#ef4444'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f0518; color: #fff; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f0518; }
        ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6d28d9; }

        /* Veg/Non-Veg Icons */
        .indicator-veg { border: 1px solid #22c55e; width: 12px; height: 12px; display: flex; align-items: center; justify-content: center; padding: 1px; border-radius: 2px; }
        .dot-veg { background-color: #22c55e; width: 6px; height: 6px; border-radius: 50%; }
        .indicator-nonveg { border: 1px solid #ef4444; width: 12px; height: 12px; display: flex; align-items: center; justify-content: center; padding: 1px; border-radius: 2px; }
        .tri-nonveg { width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 6px solid #ef4444; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONFIGURATION ---
    const API_BASE_URL = '';

    // --- 1. HELPERS ---
    const getTimeAgo = (timestamp) => {
        if (!timestamp) return '';
        const orderTime = new Date(timestamp.endsWith('Z') ? timestamp : timestamp + 'Z');
        const now = new Date();
        const diffInSeconds = Math.floor((now - orderTime) / 1000);

        if (isNaN(diffInSeconds)) return 'Just now';

        if (diffInSeconds < 60) return `${Math.max(0, diffInSeconds)}s`;
        const mins = Math.floor(diffInSeconds / 60);
        if (mins < 60) return `${mins}m`;
        const hours = Math.floor(mins / 60);
        return `${hours}h`;
    };

    const formatCurrency = (amount) => {
        return new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            minimumFractionDigits: 0,
        }).format(amount);
    };

    const VegIcon = () => (<div className="indicator-veg"><div className="dot-veg"></div></div>);
    const NonVegIcon = () => (<div className="indicator-nonveg"><div className="tri-nonveg"></div></div>);

    // --- 2. COMPONENTS ---

    const OrderCard = ({ order, updateStatus, togglePaid }) => {
        let borderClass = 'border-l-4 border-brand-gold';
        let statusBadge = 'bg-brand-gold/10 text-brand-gold border border-brand-gold/30';
        let cardOpacity = 'opacity-100';

        if (order.status === 'ready') {
            borderClass = 'border-l-4 border-brand-green';
            statusBadge = 'bg-brand-green/10 text-brand-green border border-brand-green/30';
        } else if (order.status === 'completed') {
            borderClass = 'border-l-4 border-gray-600';
            statusBadge = 'bg-gray-700/50 text-gray-400 border border-gray-600';
            cardOpacity = 'opacity-75';
        }

        const isTakeaway = order.packingCharge > 0;

        return (
            <div className={`bg-dark-card rounded-lg shadow-lg ${borderClass} ${cardOpacity} flex flex-col h-full animate-fade-in relative overflow-hidden group`}>
                {/* Compact Header */}
                <div className="p-3 border-b border-white/5 bg-white/[0.02]">
                    <div className="flex justify-between items-start">
                        <div className="flex flex-col">
                            <div className="flex items-center gap-2 mb-1">
                                <h3 className="text-xl md:text-2xl font-bold text-white tracking-tight">#{order.id}</h3>
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider ${statusBadge}`}>
                                    {order.status}
                                </span>
                            </div>
                            <div className="flex items-center gap-2 text-[10px] md:text-xs text-gray-400">
                                <span className="flex items-center gap-1 bg-white/5 px-1.5 py-0.5 rounded">
                                    <i className="ph-fill ph-clock"></i> {getTimeAgo(order.timestamp)}
                                </span>
                                {isTakeaway ? (
                                    <span className="flex items-center gap-1 text-brand-gold bg-brand-gold/10 px-1.5 py-0.5 rounded border border-brand-gold/20">
                                        <i className="ph-fill ph-shopping-bag"></i> To-Go
                                    </span>
                                ) : (
                                    <span className="flex items-center gap-1 text-blue-300 bg-blue-500/10 px-1.5 py-0.5 rounded border border-blue-500/20">
                                        <i className="ph-fill ph-chair"></i> Dine
                                    </span>
                                )}
                            </div>
                        </div>
                        <div className="text-right">
                            <div className="text-lg md:text-xl font-bold text-white">
                                {order.tableNumber ? `T-${order.tableNumber}` : 'NA'}
                            </div>
                            <div className="text-xs text-gray-400 font-medium truncate max-w-[80px]" title={order.customerName}>
                                {order.customerName || 'Guest'}
                            </div>
                        </div>
                    </div>
                </div>

                {/* Compact List */}
                <div className="flex-1 p-3 space-y-2 overflow-y-auto max-h-[40vh] md:max-h-[300px]">
                    {order.cart && order.cart.map((item, idx) => {
                        const isVeg = (item.selectedVariant?.type === 'VEG') ||
                                      (item.name && (item.name.toLowerCase().includes('veg') || item.name.toLowerCase().includes('babycorn') || item.name.toLowerCase().includes('fries'))) && !item.name.toLowerCase().includes('non');

                        return (
                            <div key={idx} className="flex gap-2 text-sm items-start">
                                <div className="font-bold text-brand-purple bg-brand-purple/10 border border-brand-purple/30 w-6 h-6 flex items-center justify-center rounded flex-shrink-0 text-sm">
                                    {item.quantity}
                                </div>
                                <div className="flex-1 min-w-0">
                                    <div className="flex items-start justify-between">
                                        <span className={`font-medium text-sm leading-tight truncate pr-1 ${order.status === 'completed' ? 'text-gray-500 line-through' : 'text-gray-200'}`}>
                                            {item.name}
                                        </span>
                                        <div className="mt-1 flex-shrink-0">
                                            {isVeg ? <VegIcon/> : <NonVegIcon/>}
                                        </div>
                                    </div>
                                    {item.selectedVariant && (
                                        <div className="text-[10px] text-gray-500 flex items-center gap-2">
                                            <span className="uppercase tracking-wide">{item.selectedVariant.type}</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>

                {/* Footer */}
                <div className="mt-auto p-2 md:p-3 border-t border-white/5 bg-black/20">
                    <div className="flex justify-between items-center mb-2 px-1">
                        <div className="text-gray-400 text-xs font-mono">
                            Qty: {order.cart ? order.cart.reduce((acc, i) => acc + i.quantity, 0) : 0}
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-sm font-bold text-brand-gold">{formatCurrency(order.total_amount)}</span>
                            <button
                                onClick={() => togglePaid(order.id, !order.is_paid)}
                                className={`text-[10px] font-bold px-2 py-0.5 rounded border transition-all flex items-center gap-1
                                ${order.is_paid
                                    ? 'bg-green-900/20 border-green-500/50 text-green-400'
                                    : 'bg-red-900/20 border-red-500/50 text-red-400'}`}
                            >
                                {order.is_paid ? 'PAID' : 'PENDING'}
                            </button>
                        </div>
                    </div>

                    {order.status === 'pending' && (
                        <button onClick={() => updateStatus(order.id, 'ready')} className="w-full bg-brand-gold hover:bg-yellow-500 active:bg-yellow-600 text-black font-extrabold py-2 rounded transition-colors flex items-center justify-center gap-2 text-sm shadow-lg">
                            <i className="ph-bold ph-check-circle"></i> Ready
                        </button>
                    )}
                    {order.status === 'ready' && (
                        <button onClick={() => updateStatus(order.id, 'completed')} className="w-full bg-brand-green hover:bg-green-600 active:bg-green-700 text-white font-bold py-2 rounded transition-colors flex items-center justify-center gap-2 text-sm shadow-lg">
                            <i className="ph-bold ph-check"></i> Complete
                        </button>
                    )}
                    {order.status === 'completed' && (
                        <div className="text-center text-gray-600 text-xs font-medium py-1">
                            Closed
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const KitchenApp = () => {
        const [orders, setOrders] = useState([]);
        const [totalSales, setTotalSales] = useState(0);
        const [filter, setFilter] = useState('active');
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        // --- 3. FETCHING DATA ---
        const fetchOrders = async () => {
            try {
                const response = await fetch(`${API_BASE_URL}/api/kitchen`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                setOrders(data.orders || []);
                setTotalSales(data.total_sales || 0);
                setError(null);
            } catch (err) {
                console.error("Failed to fetch orders:", err);
                setError("Connection lost.");
            } finally {
                setLoading(false);
            }
        };

        // --- 4. DATA POLLING ---
        useEffect(() => {
            fetchOrders();
            const intervalId = setInterval(fetchOrders, 5000);
            return () => clearInterval(intervalId);
        }, []);

        // --- 5. UPDATING STATUS ---
        const updateOrderStatus = async (orderId, newStatus) => {
            setOrders(prevOrders => prevOrders.map(o =>
                o.id === orderId ? { ...o, status: newStatus } : o
            ));

            try {
                const response = await fetch(`${API_BASE_URL}/api/order/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: orderId, status: newStatus })
                });

                if (!response.ok) throw new Error('Failed to update status on server');
                fetchOrders();
            } catch (err) {
                console.error("Sync failed:", err);
                fetchOrders();
            }
        };

        const togglePaidStatus = async (orderId, isPaid) => {
            setOrders(prevOrders => prevOrders.map(o =>
                o.id === orderId ? { ...o, is_paid: isPaid } : o
            ));

            try {
                const response = await fetch(`${API_BASE_URL}/api/order/payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: orderId, is_paid: isPaid })
                });

                if (!response.ok) throw new Error('Failed to update payment status');
                fetchOrders();
            } catch (err) {
                console.error("Sync failed:", err);
                fetchOrders();
            }
        };

        const activeOrders = orders.filter(o => o.status === 'pending' || o.status === 'ready');
        const completedOrders = orders.filter(o => o.status === 'completed');
        const displayOrders = filter === 'active' ? activeOrders : completedOrders;

        const pendingCount = activeOrders.filter(o => o.status === 'pending').length;
        const readyCount = activeOrders.filter(o => o.status === 'ready').length;

        return (
            <div className="min-h-screen flex flex-col bg-dark-bg text-white">
                {/* Slim Header */}
                <header className="bg-dark-header border-b border-white/5 px-3 py-2 md:px-6 md:py-4 flex justify-between items-center sticky top-0 z-50 shadow-2xl backdrop-blur-md bg-opacity-95">
                    <div className="flex items-center gap-2 md:gap-4">
                        {/* Hidden on mobile to save space */}
                        <div className="hidden md:block bg-gradient-to-br from-brand-purple to-purple-900 p-2.5 rounded-xl shadow-lg border border-white/10">
                            <i className="ph-fill ph-cooking-pot text-white text-2xl"></i>
                        </div>
                        <div className="flex flex-col">
                            <h1 className="text-lg md:text-xl font-bold tracking-wide text-gray-100 leading-tight">🥟🥡🥢🥟ྀིྀི</h1>
                            <div className="flex items-center gap-1.5 text-[10px] text-brand-green font-medium">
                                <span className="relative flex h-1.5 w-1.5">
                                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                  <span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-green-500"></span>
                                </span>
                                Live
                            </div>
                        </div>
                    </div>

                    {/* Integrated Filters & Stats for Mobile Efficiency */}
                    <div className="flex bg-white/5 p-1 rounded-lg border border-white/5">
                        <button onClick={() => setFilter('active')} className={`flex flex-col md:flex-row items-center justify-center px-3 md:px-5 py-1 md:py-2 rounded text-xs md:text-sm font-bold transition-all duration-200 ${filter === 'active' ? 'bg-brand-purple text-white shadow-lg' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                            <span>Active</span>
                            {/* Integrated badges for mobile */}
                            <div className="flex gap-1 md:ml-2 mt-0.5 md:mt-0">
                                {pendingCount > 0 && <span className="bg-brand-gold text-black text-[9px] px-1 rounded-sm leading-tight">{pendingCount}</span>}
                                {readyCount > 0 && <span className="bg-brand-green text-black text-[9px] px-1 rounded-sm leading-tight">{readyCount}</span>}
                            </div>
                        </button>
                        <button onClick={() => setFilter('completed')} className={`px-3 md:px-5 py-1 md:py-2 rounded text-xs md:text-sm font-bold transition-all duration-200 ${filter === 'completed' ? 'bg-brand-purple text-white shadow-lg' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                            Completed
                        </button>
                    </div>
                </header>

                <main className="flex-1 p-3 md:p-6 overflow-y-auto">
                    {loading && orders.length === 0 ? (
                        <div className="flex items-center justify-center h-full text-brand-gold animate-pulse text-sm">
                            Connecting...
                        </div>
                    ) : error ? (
                        <div className="flex flex-col items-center justify-center h-full text-brand-red">
                            <i className="ph-bold ph-warning-circle text-2xl mb-1"></i>
                            <p className="text-sm">{error}</p>
                            <button onClick={fetchOrders} className="mt-2 px-3 py-1 bg-white/10 rounded text-xs">Retry</button>
                        </div>
                    ) : displayOrders.length === 0 ? (
                        <div className="flex flex-col items-center justify-center h-full text-gray-600">
                            <i className="ph-duotone ph-check-circle text-4xl opacity-50 mb-2"></i>
                            <h2 className="text-lg font-bold text-gray-500">All caught up!</h2>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-6">
                            {displayOrders.map(order => (
                                <OrderCard key={order.id} order={order} updateStatus={updateOrderStatus} togglePaid={togglePaidStatus} />
                            ))}
                        </div>
                    )}
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KitchenApp />);
</script>

</body>
</html>
