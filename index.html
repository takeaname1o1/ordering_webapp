<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali Momo - Ordering App</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#5e1e8a',
                            light: '#f3e8ff',
                            gold: '#d4af37',
                        }
                    },
                    boxShadow: {
                        'up': '0 -4px 6px -1px rgba(0, 0, 0, 0.1)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8f8f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Veg/Non-Veg Icons */
        .veg-icon { border: 1px solid #16a34a; display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; padding: 1px; border-radius: 2px; }
        .veg-dot { background-color: #16a34a; width: 8px; height: 8px; border-radius: 50%; }

        .nonveg-icon { border: 1px solid #b91c1c; display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; padding: 1px; border-radius: 2px; }
        .nonveg-triangle { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 8px solid #b91c1c; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- Components ---

    const VegIcon = () => (
        <div className="veg-icon" title="Vegetarian"><div className="veg-dot"></div></div>
    );

    const NonVegIcon = () => (
        <div className="nonveg-icon" title="Non-Vegetarian"><div className="nonveg-triangle"></div></div>
    );

       const Header = ({ onShowHistory }) => (
      <header className="bg-brand-purple px-4 pt-2 pb-8 rounded-b-[1.5rem] shadow-lg relative z-0">
                <div className="flex justify-between items-center mb-6">
                    {/* Logo Image Section */}
                    <div className="flex items-center">
                        <img
                            src="static/logo.png"
                            alt="Nepali Momo"
                            className="h-16 w-auto object-contain drop-shadow-md"
                        />
                    </div>

                    {/* History Button */}
                    <div className="flex gap-2">
                        <button
                            onClick={onShowHistory}
                            className="bg-white/20 hover:bg-white/30 text-white w-9 h-9 rounded-full flex items-center justify-center transition-colors backdrop-blur-sm"
                            title="Order History"
                        >
                            <i className="ph-bold ph-clock-counter-clockwise text-xl"></i>
                        </button>
                    </div>
                </div>
            </header>
        );

    const TableInput = ({ tableNumber, setTableNumber, customerName, setCustomerName, isTableConfirmed, handleConfirmTable }) => (
        <div className="mx-4 -mt-8 bg-[#4a1670] rounded-xl p-4 text-white shadow-lg relative z-10 border border-[#6b2a96]">
            <div className="mb-3">
                <label className="block text-xs font-bold mb-1 tracking-wide text-purple-200 uppercase">Your Name</label>
                <input
                    type="text"
                    value={customerName}
                    onChange={(e) => setCustomerName(e.target.value)}
                    placeholder="Enter your name"
                    className="w-full px-3 py-2 rounded-lg text-gray-800 font-medium focus:outline-none focus:ring-2 focus:ring-brand-gold placeholder-gray-400"
                />
            </div>
            <div className="mb-0">
                <label className="block text-xs font-bold mb-1 tracking-wide text-purple-200 uppercase">Table Number</label>
                <div className="flex gap-2">
                    <input
                        type="number"
                        value={tableNumber}
                        onChange={(e) => setTableNumber(e.target.value)}
                        disabled={isTableConfirmed}
                        placeholder="Table No."
                        className="flex-1 px-3 py-2 rounded-lg text-gray-800 font-medium focus:outline-none focus:ring-2 focus:ring-brand-gold disabled:bg-gray-200 disabled:text-gray-500"
                    />
                    <button
                        onClick={handleConfirmTable}
                        disabled={isTableConfirmed}
                        className={`${isTableConfirmed ? 'bg-green-600' : 'bg-brand-gold hover:bg-[#b89530]'} text-white font-bold px-5 py-2 rounded-lg transition-colors shadow-md flex items-center justify-center min-w-[80px]`}
                    >
                        {isTableConfirmed ? <i className="ph-bold ph-check text-lg"></i> : 'Confirm'}
                    </button>
                </div>
            </div>
        </div>
    );

    const ProductCard = ({ item, addToCart }) => {
        const [selectedVariant, setSelectedVariant] = useState(item.variants[0]);
        const [quantity, setQuantity] = useState(1);
        const [isAdded, setIsAdded] = useState(false);

        const handleAdd = () => {
            addToCart({
                ...item,
                selectedVariant: selectedVariant,
                quantity: quantity
            });
            setIsAdded(true);
            setTimeout(() => setIsAdded(false), 1500);
            setQuantity(1);
        };

        const isVeg = selectedVariant.type === 'VEG' || item.name.toLowerCase().includes('babycorn') || item.name.toLowerCase().includes('fries');

        return (
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
                <div className="flex justify-between items-start gap-2 mb-2">
                    <h3 className="font-bold text-gray-800 text-base leading-tight">{item.name}</h3>
                    <div className="flex-shrink-0 mt-1">
                        {isVeg ? <VegIcon/> : <NonVegIcon/>}
                    </div>
                </div>

                <p className="text-xs text-gray-500 mb-4 leading-relaxed line-clamp-2">{item.desc}</p>

                <div className="flex justify-between items-end">
                    <div className="flex gap-4 overflow-x-auto hide-scrollbar pb-1">
                        {item.variants.map((v) => (
                            <button
                                key={v.type}
                                onClick={() => setSelectedVariant(v)}
                                className={`flex flex-col items-start group flex-shrink-0`}
                            >
                                <span className={`text-[10px] font-bold transition-colors whitespace-nowrap ${selectedVariant.type === v.type ? 'text-brand-purple underline decoration-2 underline-offset-2' : 'text-gray-400'}`}>
                                    {v.type}
                                </span>
                                <span className={`text-sm font-bold transition-colors ${selectedVariant.type === v.type ? 'text-gray-900' : 'text-gray-400'}`}>
                                    ₹ {v.price}
                                </span>
                            </button>
                        ))}
                    </div>

                    <div className="flex gap-3 items-center">
                        <div className="flex items-center border border-gray-200 rounded-md bg-gray-50 h-8">
                            <button
                                onClick={() => setQuantity(Math.max(1, quantity - 1))}
                                className="px-2.5 h-full text-gray-500 hover:text-brand-purple hover:bg-gray-100 rounded-l-md font-bold"
                            >−</button>
                            <span className="px-1 text-sm font-bold text-gray-700 min-w-[1.5rem] text-center">{quantity}</span>
                            <button
                                onClick={() => setQuantity(quantity + 1)}
                                className="px-2.5 h-full text-gray-500 hover:text-brand-purple hover:bg-gray-100 rounded-r-md font-bold"
                            >+</button>
                        </div>

                        <button
                            onClick={handleAdd}
                            className={`${isAdded ? 'bg-green-600' : 'bg-brand-purple'} text-white text-xs font-bold px-4 py-2 rounded-lg shadow-md active:scale-95 transition-all uppercase tracking-wide min-w-[80px]`}
                        >
                            {isAdded ? 'Added' : 'Add'}
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    const CartFooter = ({ cart, onOpenCart }) => {
        const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
        const totalPrice = cart.reduce((acc, item) => acc + (item.selectedVariant.price * item.quantity), 0);

        return (
            <div className="fixed bottom-0 left-0 right-0 p-4 z-40 bg-gradient-to-t from-gray-100 to-transparent">
                <div className="max-w-md mx-auto">
                    <button
                        onClick={onOpenCart}
                        className="w-full bg-brand-purple text-white p-4 rounded-xl shadow-2xl flex justify-between items-center transform transition-transform active:scale-98"
                    >
                        <div className="flex flex-col items-start text-xs">
                            <span className="font-bold uppercase tracking-wider text-purple-200">{totalItems} Items</span>
                            <span className="text-lg font-bold">₹{totalPrice.toFixed(2)}</span>
                        </div>
                        <div className="flex items-center gap-2 font-bold text-sm">
                            View Cart <i className="ph-bold ph-arrow-right"></i>
                        </div>
                    </button>
                </div>
            </div>
        );
    };

    const CartDrawer = ({ isOpen, onClose, cart, updateQuantity, customerName, tableNumber, onOrderSuccess }) => {
        const [isPacking, setIsPacking] = useState(false);
        const itemTotal = cart.reduce((sum, item) => sum + (item.selectedVariant.price * item.quantity), 0);
        const packingCharge = isPacking ? 8 : 0;
        const grandTotal = itemTotal + packingCharge;

        return (
            <AnimatePresence>
                {isOpen && (
                    <>
                        <motion.div
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            exit={{ opacity: 0 }}
                            onClick={onClose}
                            className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50"
                        />

                        <motion.div
                            initial={{ y: "100%" }}
                            animate={{ y: 0 }}
                            exit={{ y: "100%" }}
                            transition={{ type: "spring", damping: 25, stiffness: 300 }}
                            className="fixed bottom-0 left-0 right-0 z-50 bg-[#f8f9fa] rounded-t-3xl h-[85vh] md:h-[600px] md:max-w-md md:mx-auto md:inset-x-0 md:bottom-0 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden"
                        >
                            <div className="bg-white px-6 py-4 border-b border-gray-100 flex justify-between items-center sticky top-0 z-10">
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800">Your Cart</h2>
                                    <p className="text-xs text-gray-400">{cart.reduce((acc, item) => acc + item.quantity, 0)} items selected</p>
                                </div>
                                <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors">
                                    <i className="ph-bold ph-x"></i>
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                {cart.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-64 text-gray-400 text-center">
                                        <i className="ph-duotone ph-shopping-cart text-6xl mb-4 text-gray-300"></i>
                                        <p className="font-medium">Your cart is empty</p>
                                        <p className="text-xs mt-1">Add some delicious momos!</p>
                                    </div>
                                ) : (
                                    <>
                                        {cart.map((item) => (
                                            <div key={item.cartId} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-2">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h4 className="font-bold text-gray-800 text-sm line-clamp-1">{item.name}</h4>
                                                        <div className="flex items-center gap-1 mt-1">
                                                            {(item.selectedVariant.type === 'VEG' || item.name.includes('Babycorn') || item.name.includes('Fries')) ? <VegIcon/> : <NonVegIcon/>}
                                                            <span className="text-[10px] font-semibold text-gray-500">{item.selectedVariant.type}</span>
                                                        </div>
                                                    </div>
                                                    <span className="font-bold text-sm">₹{item.selectedVariant.price * item.quantity}</span>
                                                </div>

                                                <div className="flex justify-between items-center mt-1">
                                                    <div className="text-[10px] text-gray-400">₹{item.selectedVariant.price} / item</div>
                                                    <div className="flex items-center border border-gray-200 rounded-md bg-gray-50 h-7">
                                                        <button
                                                            onClick={() => updateQuantity(item.cartId, -1)}
                                                            className="px-2 h-full text-gray-500 hover:text-red-500 hover:bg-red-50 rounded-l-md font-bold transition-colors"
                                                        >
                                                            {item.quantity === 1 ? <i className="ph-bold ph-trash"></i> : '-'}
                                                        </button>
                                                        <span className="px-2 text-xs font-bold text-gray-700 min-w-[1.5rem] text-center">{item.quantity}</span>
                                                        <button
                                                            onClick={() => updateQuantity(item.cartId, 1)}
                                                            className="px-2 h-full text-gray-500 hover:text-brand-purple hover:bg-gray-100 rounded-r-md font-bold"
                                                        >+</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </>
                                )}
                            </div>

                            {cart.length > 0 && (
                                <div className="bg-white p-4 border-t border-gray-100 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20">
                                    <label className="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 mb-3 cursor-pointer select-none">
                                        <div className="flex items-center gap-2">
                                            <div className="bg-white p-1 rounded border border-gray-200 text-gray-500">
                                                <i className="ph-fill ph-package"></i>
                                            </div>
                                            <span className="text-sm font-medium text-gray-700">Pack this order?</span>
                                        </div>
                                        <div className="relative">
                                            <input type="checkbox" className="hidden" checked={isPacking} onChange={() => setIsPacking(!isPacking)} />
                                            <div className={`w-10 h-5 rounded-full shadow-inner transition-colors duration-200 ease-in-out ${isPacking ? 'bg-brand-purple' : 'bg-gray-300'}`}></div>
                                            <div className={`absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200 ease-in-out ${isPacking ? 'translate-x-5' : 'translate-x-0'}`}></div>
                                        </div>
                                    </label>

                                    <div className="space-y-2 mb-4">
                                        <div className="flex justify-between text-xs text-gray-600">
                                            <span>Item Total</span>
                                            <span>₹{itemTotal.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-gray-600">
                                            <span>Packaging Charge</span>
                                            <span>₹{packingCharge.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between text-base font-bold text-gray-900 pt-2 border-t border-dashed border-gray-200">
                                            <span>Grand Total</span>
                                            <span>₹{grandTotal.toFixed(2)}</span>
                                        </div>
                                    </div>
                                    <PlaceOrderButton
                                        cart={cart}
                                        grandTotal={grandTotal}
                                        packingCharge={packingCharge}
                                        customerName={customerName}
                                        tableNumber={tableNumber}
                                        onOrderSuccess={onOrderSuccess}
                                    />
                                </div>
                            )}
                        </motion.div>
                    </>
                )}
            </AnimatePresence>
        );
    };

    const PlaceOrderButton = ({ cart, grandTotal, packingCharge, customerName, tableNumber, onOrderSuccess }) => {
        const [loading, setLoading] = useState(false);

        const handlePlaceOrder = async () => {
            if (!tableNumber) {
                alert("Please confirm your Table Number at the top of the page.");
                return;
            }
            if (!customerName || customerName.trim() === "") {
                alert("Please enter your Name at the top of the page.");
                return;
            }

            setLoading(true);

            const orderPayload = {
                tableNumber,
                customerName,
                cart,
                totalAmount: grandTotal,
                packingCharge
            };

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    onOrderSuccess({
                        id: data.orderId,
                        ordersAhead: data.ordersAhead,
                        customerName: data.customerName,
                        cart,
                        totalAmount: grandTotal,
                        packingCharge,
                        timestamp: new Date().toISOString()
                    });
                } else {
                    throw new Error(data.error || "Server rejected order");
                }
            } catch (error) {
                console.error("Order Request Failed:", error);
                alert("Failed to place order. Please try again or call waiter.\n\nError: " + error.message);
            } finally {
                setLoading(false);
            }
        };

        return (
            <button
                className={`w-full bg-brand-purple text-white font-bold py-3.5 rounded-xl shadow-lg shadow-purple-200 active:scale-[0.98] transition-all flex justify-between px-6 ${loading ? 'opacity-70 cursor-not-allowed' : ''}`}
                onClick={handlePlaceOrder}
                disabled={loading}
            >
                <span>{loading ? 'Sending...' : 'Place Order'}</span>
                <span>₹{grandTotal.toFixed(2)}</span>
            </button>
        );
    };

    const OrderHistory = ({ onBack, onReorder }) => {
        const [history, setHistory] = useState([]);

        useEffect(() => {
            const saved = localStorage.getItem('nepaliMomo_orders');
            if (saved) {
                try {
                    setHistory(JSON.parse(saved).reverse());
                } catch (e) {
                    console.error("Failed to parse history", e);
                }
            }
        }, []);

        return (
            <div className="min-h-screen bg-[#f8f9fa] flex flex-col pt-4 pb-4 px-4">
                 <div className="flex items-center gap-4 mb-6">
                    <button onClick={onBack} className="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-600 hover:bg-gray-50">
                        <i className="ph-bold ph-arrow-left"></i>
                    </button>
                    <h1 className="text-xl font-bold text-gray-800">Order History</h1>
                </div>

                {history.length === 0 ? (
                    <div className="flex flex-col items-center justify-center mt-20 text-gray-400">
                        <i className="ph-duotone ph-receipt text-6xl mb-4 text-gray-300"></i>
                        <p>No past orders found.</p>
                    </div>
                ) : (
                    <div className="space-y-4">
                        {history.map((order, index) => (
                            <div key={index} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <div className="flex justify-between items-start mb-3 border-b border-gray-50 pb-2">
                                    <div>
                                        <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">
                                            {new Date(order.timestamp).toLocaleDateString()} • {new Date(order.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                        </div>
                                        <div className="text-xs font-medium text-gray-500 mt-0.5">Order #{order.id}</div>
                                    </div>
                                    <span className="bg-green-100 text-green-700 text-[10px] font-bold px-2 py-1 rounded-full uppercase">
                                        Received
                                    </span>
                                </div>

                                <div className="space-y-1 mb-3">
                                    {order.cart.map((item, i) => (
                                        <div key={i} className="text-sm text-gray-700 flex justify-between">
                                            <span className="line-clamp-1 flex-1">
                                                <span className="font-bold text-gray-400 mr-2 text-xs">{item.quantity}x</span>
                                                {item.name} <span className="text-[10px] text-gray-400">({item.selectedVariant.type})</span>
                                            </span>
                                        </div>
                                    ))}
                                </div>

                                <div className="flex justify-between items-center pt-2 border-t border-dashed border-gray-200">
                                    <span className="font-bold text-brand-purple">₹{order.totalAmount.toFixed(2)}</span>
                                    <button
                                        onClick={() => onReorder(order.cart)}
                                        className="text-brand-purple text-xs font-bold px-3 py-1.5 bg-brand-light rounded-lg hover:bg-purple-100 transition-colors flex items-center gap-1"
                                    >
                                        <i className="ph-bold ph-arrow-counter-clockwise"></i> Repeat Order
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );
    };

    const OrderConfirmation = ({ order }) => (
        <div className="min-h-screen bg-brand-purple flex flex-col items-center justify-center p-6 text-white text-center relative overflow-hidden">
            <div className="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>

            <motion.div
                initial={{ scale: 0.5, opacity: 0 }}
                animate={{ scale: 1, opacity: 1 }}
                className="w-24 h-24 bg-brand-green rounded-full flex items-center justify-center shadow-xl mb-6 relative z-10"
            >
                <i className="ph-bold ph-check text-5xl"></i>
            </motion.div>

            <h1 className="text-3xl font-bold mb-2">Order Placed!</h1>
            <p className="text-purple-200 mb-8 max-w-[250px]">The kitchen has received your order.</p>

            <div className="bg-white/10 backdrop-blur-md rounded-2xl p-6 w-full max-w-sm border border-white/20 mb-8">
                <div className="flex justify-between items-center mb-4 border-b border-white/10 pb-4">
                    <span className="text-purple-200 text-sm uppercase tracking-wider">Order ID</span>
                    <span className="font-mono font-bold text-2xl">#{order.id}</span>
                </div>

                <div className="flex justify-between items-center">
                    <span className="text-purple-200 text-sm">Amount to Pay</span>
                    <span className="font-bold text-brand-gold text-lg">₹{order.totalAmount.toFixed(2)}</span>
                </div>
            </div>


        </div>
    );

    const App = () => {
        const [menuData, setMenuData] = useState([]);
        const [view, setView] = useState('MENU');
        const [lastOrder, setLastOrder] = useState(null);

        const [tableNumber, setTableNumber] = useState("");
        const [customerName, setCustomerName] = useState("");
        const [isTableConfirmed, setIsTableConfirmed] = useState(false);
        const [cart, setCart] = useState([]);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            fetch('menu.json')
                .then(response => response.json())
                .then(data => {
                    setMenuData(data);
                    setLoading(false);
                })
                .catch(error => {
                    console.error("Error loading menu:", error);
                    setLoading(false);
                });
        }, []);

        useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const tableParam = params.get('table');
            if (tableParam) {
                setTableNumber(tableParam);
                setIsTableConfirmed(true);
            }
            const cachedName = localStorage.getItem('nepaliMomo_user');
            if(cachedName) setCustomerName(cachedName);
        }, []);

        const handleConfirmTable = () => {
            if (tableNumber.trim()) {
                setIsTableConfirmed(true);
                localStorage.setItem('nepaliMomo_user', customerName);
            }
        };

        const addToCart = (product) => {
            setCart(prevCart => {
                const existingIndex = prevCart.findIndex(item =>
                    item.id === product.id &&
                    item.selectedVariant.type === product.selectedVariant.type
                );

                if (existingIndex >= 0) {
                    const newCart = [...prevCart];
                    newCart[existingIndex] = {
                        ...newCart[existingIndex],
                        quantity: newCart[existingIndex].quantity + product.quantity
                    };
                    return newCart;
                } else {
                    return [...prevCart, { ...product, cartId: Date.now() + Math.random() }];
                }
            });
        };

        const updateQuantity = (cartId, delta) => {
            setCart(prevCart => {
                return prevCart.map(item => {
                    if (item.cartId === cartId) {
                        return { ...item, quantity: item.quantity + delta };
                    }
                    return item;
                }).filter(item => item.quantity > 0);
            });
        };

        const handleOrderSuccess = (orderData) => {
            setLastOrder(orderData);
            setCart([]);
            setIsCartOpen(false);

            const existingHistory = JSON.parse(localStorage.getItem('nepaliMomo_orders') || '[]');
            existingHistory.push(orderData);
            localStorage.setItem('nepaliMomo_orders', JSON.stringify(existingHistory));

            setView('CONFIRMATION');
        };

        const handleReorder = (itemsToReorder) => {
            const newItems = itemsToReorder.map(item => ({...item, cartId: Date.now() + Math.random()}));
            setCart(newItems);
            setView('MENU');
            setIsCartOpen(true);
        }

        if (view === 'CONFIRMATION' && lastOrder) {
            return <OrderConfirmation order={lastOrder} onBack={() => setView('MENU')} />;
        }

        if (view === 'HISTORY') {
            return <OrderHistory onBack={() => setView('MENU')} onReorder={handleReorder} />;
        }

        return (
            <div className="max-w-md mx-auto min-h-screen bg-[#f8f9fa] shadow-2xl overflow-hidden relative font-sans">

                <Header onShowHistory={() => setView('HISTORY')} />
                <TableInput
                    tableNumber={tableNumber}
                    setTableNumber={setTableNumber}
                    customerName={customerName}
                    setCustomerName={setCustomerName}
                    isTableConfirmed={isTableConfirmed}
                    handleConfirmTable={handleConfirmTable}
                />

                <main className="p-4 space-y-8 mt-2 pb-28">
                    {loading ? (
                        <div className="flex flex-col items-center justify-center mt-20 text-brand-purple">
                            <i className="ph-bold ph-spinner animate-spin text-4xl mb-2"></i>
                            <p>Loading Menu...</p>
                        </div>
                    ) : (
                        ['Classic Momo', 'Signature Momo', 'Platters & Combos', 'Starters'].map(category => {
                            const items = menuData.filter(i => i.category === category);
                            if(items.length === 0) return null;

                            return (
                                <section key={category}>
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 className="text-brand-purple font-extrabold text-sm tracking-widest uppercase">{category}</h2>
                                    </div>
                                    {items.map(item => (
                                        <ProductCard key={item.id} item={item} addToCart={addToCart} />
                                    ))}
                                </section>
                            )
                        })
                    )}
                </main>

                {cart.length > 0 && (
                    <CartFooter
                        cart={cart}
                        onOpenCart={() => setIsCartOpen(true)}
                    />
                )}

                <CartDrawer
                    isOpen={isCartOpen}
                    onClose={() => setIsCartOpen(false)}
                    cart={cart}
                    updateQuantity={updateQuantity}
                    customerName={customerName}
                    tableNumber={tableNumber}
                    onOrderSuccess={handleOrderSuccess}
                />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

</script>
</body>
</html>
